name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # lets you trigger manually from the GitHub UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java (required by Gradle / Android SDK) ─────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Install Flutter (matches your local 3.47.2 stable) ─────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # ── 4. Confirm Flutter & Dart versions ────────────────────────────────
      - name: Flutter version info
        run: flutter --version

      # ── 5. Write local.properties so Gradle can find the Flutter SDK ───────
      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >> android/local.properties
        working-directory: durga-ai-flutter

      # ── 6. Install dependencies ───────────────────────────────────────────
      - name: flutter pub get
        run: flutter pub get
        working-directory: durga-ai-flutter

      # ── 7. Analyze code (non-fatal: warnings won't block the build) ────────
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
        working-directory: durga-ai-flutter

      # ── 8. Build the release APK ──────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release
        working-directory: durga-ai-flutter

      # ── 9. Upload the APK as a downloadable artifact ─────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: durga-ai-release-apk
          path: durga-ai-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
